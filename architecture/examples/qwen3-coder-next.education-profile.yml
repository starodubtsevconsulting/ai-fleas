schema_version: ai-fleas-model-education.v1

model: qwen3-coder-next

status:
  maturity: draft
  basis:
    - public-model-documentation
  note: >
    Draft means public information and preliminary evidence, not an authoritative
    description of what the model knows. Controlled extraction should revise it.

education:
  native_world:
    primary:
      - software-engineering
      - source-code
      - repositories
      - APIs
      - tests
      - tools
      - processes
      - data-structures
    secondary:
      - general-technical-knowledge
      - general-world-knowledge
    uncertain:
      - specialized-business-domains
      - organization-specific-semantics

  conceptual_language:
    fluent:
      - interface
      - state
      - invariant
      - process
      - function
      - input-output
      - boundary
      - dependency
      - test-case
      - failure-mode
    translate_first:
      - unfamiliar-business-rules
      - organization-specific-language
      - specialized-domain-invariants
    do_not_assume:
      - implicit-human-context
      - embodied-experience
      - undocumented-local-conventions

communication:
  preferred:
    - concrete
    - causal
    - structured
    - explicit-invariants
    - positive-and-misleading-examples

  translation_patterns:
    unfamiliar_object:
      map_relevant_dimensions_to:
        - object-or-data
        - properties
        - state
        - relationships
        - likely-actions
    unfamiliar_process:
      map_to:
        - actors
        - state-transitions
        - inputs
        - outputs
        - invariants
        - failure-cases
    unfamiliar_business_rule:
      map_to:
        - positive-example
        - misleading-near-example
        - invariant
        - relevant-code-or-data-boundary

  observed_working_patterns:
    - software-analogy-plus-exact-invariant
    - positive-and-misleading-examples
    - explicit-code-boundary

  observed_not_sufficient:
    - raw-domain-jargon-without-operational-meaning
    - analogy-without-exact-invariant
    - more-context-without-relevance
    - translated-context-for-every-hard-reasoning-problem

observed_capability:
  strengths:
    - focused-repository-work
    - bounded-file-edits
  limits:
    - completion-claim-requires-independent-verification
    - repeated-tool-actions-can-continue-after-useful-result
    - clearer-domain-teaching-does-not-guarantee-hard-implementation-transfer

role_fit:
  provisional:
    - focused-coder
    - bounded-repository-worker

evidence:
  - claim: translated-domain-context-helped-financial-recognizer-first-pass
    status: observed
    confidence: medium
    result:
      task_only: 3/9
      raw_domain: 5/9
      translated_domain: 8/9

  - claim: translated-domain-context-solves-process-lifecycle-reasoning
    status: contradicted
    confidence: medium
    result:
      translated_domain_first_pass: 0/8

unknowns:
  - breadth-of-specialized-world-knowledge
  - lower-boundary-where-domain-translation-stops-helping
  - generalization-of-observed-handoff-effects

deployment_note:
  exclude_from_education:
    - parameter-count
    - quantization
    - context-window
    - runtime
    - hardware
  reason: deployment-and-capacity-properties-are-not-education
