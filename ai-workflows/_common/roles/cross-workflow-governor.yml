schemaVersion: role.v1
extends: _role.yml

id: cross-workflow-governor
contract: cross-workflow-governor.md

scope:
  kind: cross-workflow
  bindingOwner: profile

humanFacing: true

lifecycle:
  default: persistent

fixed:
  canonicalRole: cross-workflow-governor
  profileCardinality: one
  governedSubjectCardinality: one
  goalCardinality: many
  workflowCardinality: many
  permanentMemoryRequired: true
  intelligenceRequirement:
    class: strategic-reasoning
    minimumCapability: high
    preferStrongestEligibleModel: true
    localFallback: disabled

configurable:
  displayLabel:
    type: string
    required: false
    owner: binding

bindings:
  profile:
    type: profile-reference
    required: true
    cardinality: one
    owner: profile
    fields:
      id:
        type: string
        required: true
    description: Exact profile trust boundary for this Governor. Every governed workflow, command, memory reference, goal projection, and external effect must resolve inside this profile unless a separate cross-profile contract explicitly authorizes otherwise.

  subject:
    type: human-reference
    required: true
    cardinality: one
    owner: profile
    fields:
      id:
        type: string
        required: true
      name:
        type: string
        required: false
      coordinates:
        type: map
        required: true
        adapterDefined: true
    description: Stable identity plus platform-specific coordinates for the one governed human.

  goals:
    type: goal-reference
    required: false
    cardinality: many
    owner: profile-or-memory
    fields:
      id:
        type: string
        required: true
      intent:
        type: string
        required: true
      status:
        type: string
        required: true
      priority:
        type: any
        required: false
      constraints:
        type: list
        required: false
      successSignals:
        type: list
        required: false
      workflows:
        type: reference-list
        required: false
      memory:
        type: reference-list
        required: false
      reviewTrigger:
        type: any
        required: false
    description: Human-owned goals are independent of workflows and may span several workflows inside this Governor's profile scope.

  workflows:
    type: workflow-reference
    required: true
    cardinality: many
    owner: profile
    examples: [dev, multimedia, bookkeeping, investment]
    description: Logical workflows selected from the exact bound profile. A workflow from another profile is outside the Governor's authority even when it has the same workflow ID.

  memory:
    type: memory-reference
    required: true
    cardinality: many
    owner: profile
    fields:
      name:
        type: string
        required: true
      uri:
        type: uri
        required: true
      purpose:
        type: string
        required: true
      access:
        type: enum
        values: [read-only, read-write]
        required: true
      privacy:
        type: any
        required: false
      precedence:
        type: any
        required: false
    description: Durable external memory references authorized by the exact bound profile; storage/provider mechanics are adapter-specific.

  commands:
    type: command-reference
    required: false
    cardinality: many
    owner: profile
    providerNeutral: true
    description: Registered provider-neutral commands required for governance. Concrete providers and supported overrides resolve only through the exact bound profile's command configuration.
