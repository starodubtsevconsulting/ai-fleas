schemaVersion: workflow-logical-agents.v1
workflowId: dev
logicalProjectIdPattern: <profile-id>-dev[-<suffix>]
teamPolicy: agents/team.md

policy:
  authority: agents/team.md
  capabilityOwnershipMatrix: agents/role-capability-ownership.csv
  accessMatrixMechanism: ../_common/policy/access-matrix.md
  routing: agents/shared-execution-routing.md
  workflowRuntime: ../_common/runtime/workflow-router.md
  permissionEnvelope: agents/permission-envelope.md
  elasticPool: agents/elastic-agent-pool.md
  scope: ../_common/agents/scope.md
  continuity: ../_common/agents/continuity.md
  knowledgeTransfer: ../_common/agents/knowledge-transfer.md
  scheduling: ../_common/agents/scheduling.md

# Logical agent properties act like a portable interface. A platform adapter
# realizes the properties it supports. `aiBinding` selects a profile-owned
# provider/model binding; `profile-default` selects the workflow default.
# Scope declares where the agent belongs, independently from what it may access.
# Matrix columns bind each declared agent to workflow-local capability policy.
# Continuity follows the common default unless an agent overrides it, for example:
# `continuity: { enabled: false }` or `continuity: { maxDuration: 24h }`.
# Scheduling is independent from continuity. Each agent declares whether it is
# scheduled and, when enabled, its interval and instruction.
initializer:
  agentId: admin
  matrixColumn: admin
  roleDefinition: ../_common/roles/admin.md
  scope: workflow
  lifecycle: persistent-control
  humanFacing: human-owned
  communicationMode: direct-human-administration-only
  readinessToken: ADMIN_READY
  governedRosterOwner: manager
  aiBinding: profile-default
  schedule: { enabled: false }
  utilitySubagents:
    enabled: true
    maxConcurrent: 3
    contract: ../_common/agents/utility-subagents.md

agents:
  - agentId: designer-reviewer
    matrixColumn: designer_reviewer
    roleDefinition: ../_common/roles/designer-reviewer.md
    scope: workflow
    aliases: [designer reviewer, designer/reviewer]
    lifecycle: persistent-control
    humanFacing: primary
    communicationMode: human-dialogue-and-router-runtime
    readinessToken: DESIGNER_REVIEWER_READY
    requiresTicket: false
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: false }
  - agentId: judge
    matrixColumn: judge
    roleDefinition: ../_common/roles/judge.md
    scope: workflow
    aliases: [judge, workflow judge]
    lifecycle: persistent-control
    humanFacing: oversight-only
    communicationMode: direct-human-governance-only
    readinessToken: WORKFLOW_GOVERNANCE_JUDGE_READY
    requiresTicket: false
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: true, every: 10m, instruction: agents/schedules/judge-governance-audit.yml }
  - agentId: manager
    matrixColumn: manager
    roleDefinition: ../_common/roles/manager.md
    scope: workflow
    aliases: [manager, ask manager]
    lifecycle: persistent-control
    humanFacing: false
    communicationMode: router-runtime-only
    readinessToken: MANAGER_READY
    requiresTicket: false
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: true, every: 10m, instruction: agents/schedules/manager-continuity.yml }
  - agentId: coder
    matrixColumn: coder
    roleDefinition: ../_common/roles/coder.md
    scope: workflow
    aliases: [coder]
    lifecycle: disposable-worker
    humanFacing: false
    communicationMode: router-runtime-only
    readinessToken: CODER_READY
    requiresTicket: true
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: false }
    elasticPool: { enabled: true, minReady: 0, maxActive: 3 }
  - agentId: command-runner
    matrixColumn: command_runner
    roleDefinition: ../_common/roles/command-runner.md
    scope: workflow
    aliases: [command runner, command-runner]
    lifecycle: disposable-worker
    humanFacing: false
    communicationMode: router-runtime-only
    readinessToken: COMMAND_RUNNER_READY
    requiresTicket: true
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: false }
    elasticPool: { enabled: true, minReady: 1, maxActive: 4 }
  - agentId: ui-acceptance-tester
    matrixColumn: ui_acceptance_tester
    roleDefinition: ../_common/roles/ui-acceptance-tester.md
    scope: workflow
    aliases: [ui tester, ui-acceptance-tester]
    lifecycle: disposable-worker
    humanFacing: false
    communicationMode: router-runtime-only
    readinessToken: UI_ACCEPTANCE_TESTER_READY
    requiresTicket: true
    aiBinding: profile-default
    continuity: { maxDuration: 24h }
    schedule: { enabled: false }
