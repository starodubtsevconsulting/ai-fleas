schemaVersion: workflow-agents.v1
workflowId: dev
logicalProjectIdPattern: <profile-id>-<workflow-id>
teamPolicy: agents/team.md

policy:
  authority: agents/team.md
  routing: agents/shared-execution-routing.md
  permissionEnvelope: agents/permission-envelope.md
  elasticPool: agents/elastic-agent-pool.md
  contextClone: agents/role-context-clone.md

defaults:
  permissionEnvelope:
    scope: logical-project-workflow-and-declared-project-roots
    internalRoleApprovalReviewer: auto_review
    interactiveHumanApproval: prohibited
    outOfScopeDisposition: return-blocker-to-authorized-caller
  contextClone:
    compactionThreshold: 1
    utilizationThresholdPercent: 75
    checkpointPolicy: after every material decision, completed work slice, worker handoff, validation receipt, and external-state mutation
  elasticPool:
    enabled: false
    minReady: 0
    maxActive: 1

initializer:
  agentId: admin
  roleClass: Admin
  agentName: Admin
  roleDefinition: ../_common/roles/admin.md
  title: "🔑 Admin"
  model: gpt-5.6-sol
  reasoning: high
  lifecycle: persistent control task
  humanFacing: human-owned
  communicationMode: direct human administration only
  readinessToken: ADMIN_READY
  governedRosterOwner: manager
  adminBootstrapCreates: manager-only
  workerLifecycleDispatch: manager-default
  directAdminLifecycleOverride: separate-explicit-human-confirmation-required

agents:
  - agentId: designer / reviewer
    roleClass: Worker
    agentName: Designer Reviewer
    aliases: [designer/reviewer, designer / reviewer]
    requiresTicket: false
    roleDefinition: ../_common/roles/designer-reviewer.md
    title: "💬 Designer Reviewer"
    model: gpt-5.6-sol
    reasoning: low
    lifecycle: persistent control
    humanFacing: primary
    communicationMode: ordinary human dialogue and canonical agent packets
    readinessToken: DESIGNER_REVIEWER_READY
  - agentId: judge
    roleClass: Judge
    agentName: Judge
    aliases: [workflow judge, judge]
    requiresTicket: false
    roleDefinition: ../_common/roles/judge.md
    title: "⚖️ Judge"
    model: gpt-5.6-terra
    reasoning: low
    lifecycle: persistent control
    humanFacing: oversight-only
    communicationMode: direct human governance dialogue; scheduled self-audit
    readinessToken: WORKFLOW_GOVERNANCE_JUDGE_READY
  - agentId: manager
    roleClass: Manager
    agentName: Manager
    aliases: [ask manager, manager]
    requiresTicket: false
    roleDefinition: ../_common/roles/manager.md
    title: "🤖 Manager"
    model: gpt-5.6-luna
    reasoning: medium
    lifecycle: persistent control
    humanFacing: not human-facing (internal packet-only)
    communicationMode: internal canonical packets only
    readinessToken: MANAGER_READY
  - agentId: coder
    roleClass: Worker
    agentName: Coder
    aliases: [coder]
    requiresTicket: true
    roleDefinition: ../_common/roles/coder.md
    title: "🔀 Coder"
    model: gpt-5.6-terra
    reasoning: medium
    lifecycle: disposable worker
    humanFacing: not human-facing (internal packet-only)
    communicationMode: internal canonical packets only
    readinessToken: CODER_READY
    elasticPool:
      enabled: true
      minReady: 0
      maxActive: 3
  - agentId: command-runner
    roleClass: Worker
    agentName: Command Runner
    aliases: [command runner, command-runner]
    requiresTicket: true
    roleDefinition: ../_common/roles/command-runner.md
    title: "⚙️ Command Runner"
    model: gpt-5.6-terra
    reasoning: low
    lifecycle: disposable worker
    humanFacing: not human-facing (internal packet-only)
    communicationMode: internal canonical packets only
    readinessToken: COMMAND_RUNNER_READY
    elasticPool:
      enabled: true
      minReady: 1
      maxActive: 4
  - agentId: ui-acceptance-tester
    roleClass: Worker
    agentName: UI Acceptance Tester
    aliases: [ui tester, ui-acceptance-tester]
    requiresTicket: true
    roleDefinition: ../_common/roles/ui-acceptance-tester.md
    title: "🖥️ UI Acceptance Tester"
    model: gpt-5.6-terra
    reasoning: low
    lifecycle: disposable worker
    humanFacing: not human-facing (internal packet-only)
    communicationMode: internal canonical packets only
    readinessToken: UI_ACCEPTANCE_TESTER_READY
  - agentId: proxy-coder
    roleClass: Worker
    agentName: Proxy Coder
    aliases: [proxy coder, proxy-coder]
    requiresTicket: false
    roleDefinition: ../_common/roles/proxy-coder.md
    title: "🧠 Proxy Coder"
    model: gpt-5.6-luna
    reasoning: low
    lifecycle: persistent workflow role
    humanFacing: human-facing proxy
    communicationMode: direct human proxy dialogue and canonical Designer/Reviewer packets
    readinessToken: PROXY_CODER_READY
    execution:
      mode: proxy
      bridge: local-hermes-delegation
      target: profile-resolved-hermes-agent

dependencies:
  - consumerAgentId: designer / reviewer
    providerAgentId: manager
    kind: capability-provider
    requirement: capability-bound
    capabilities:
      - Ticket search create update and evidence-gated closure
      - Visible worker create archive and scheduler
  - consumerAgentId: designer / reviewer
    providerAgentId: coder
    kind: capability-provider
    requirement: capability-bound
    capabilities:
      - Product source configuration and tests
  - consumerAgentId: designer / reviewer
    providerAgentId: command-runner
    kind: capability-provider
    requirement: capability-bound
    capabilities:
      - Effectful command execution outside protected governance publication (editor browser Git mutation build test deploy publication scripts packages shell)
  - consumerAgentId: designer / reviewer
    providerAgentId: ui-acceptance-tester
    kind: capability-provider
    requirement: capability-bound
    capabilities:
      - Visible independent UI acceptance
  - consumerAgentId: designer / reviewer
    providerAgentId: proxy-coder
    kind: capability-provider
    requirement: capability-bound
    capabilities:
      - Registered local-Hermes delegation capability
  - consumerAgentId: coder
    providerAgentId: designer / reviewer
    kind: return-coordinator
    requirement: capability-bound
    capabilities:
      - Exact work packets and independent technical review
  - consumerAgentId: command-runner
    providerAgentId: designer / reviewer
    kind: return-coordinator
    requirement: capability-bound
    capabilities:
      - Effectful command execution outside protected governance publication (editor browser Git mutation build test deploy publication scripts packages shell)
  - consumerAgentId: ui-acceptance-tester
    providerAgentId: designer / reviewer
    kind: return-coordinator
    requirement: capability-bound
    capabilities:
      - Visible independent UI acceptance
  - consumerAgentId: proxy-coder
    providerAgentId: designer / reviewer
    kind: return-coordinator
    requirement: capability-bound
    capabilities:
      - Registered local-Hermes delegation capability
