schema_version: model-education.v1
applies_to:
  provider_model: qwen3-coder-next-q5km
declared:
  - statement: Qwen3-Coder-Next is designed for coding agents and local development, including tool-using coding.
    source_url: https://huggingface.co/Qwen/Qwen3-Coder-Next
    interpretation_limit: Design intent does not guarantee success on any particular task or deployment.
observed:
  - statement: Four focused source-port runs produced verifier-passing files from the same reviewed source.
    scope: This Q5 model through the configured Hermes CLI route on one process-group source-port fixture; two runs per tested turn cap.
    evidence_paths:
      - notes/benchmarks/local-models/gx10-turn-cap-pilot-2026-09-28.json
    interpretation_limit: A reviewed source and one-file task do not establish arbitrary repository-coding reliability.
  - statement: First-pass recognizer acceptance was 3/9 task only, 5/9 raw context, and 8/9 translated context.
    scope: Nine interleaved fresh runs per arm on one frozen financial recognizer, with Q5, Hermes CLI, and a fixed verifier.
    evidence_paths:
      - notes/benchmarks/local-models/fixtures/hermes-financial-recognizer-coding/THREE_ARM_PROTOCOL.md
      - notes/benchmarks/local-models/gx10-domain-context-three-arm-2026-09-28.json
    interpretation_limit: Translation bundled analogy, examples, and code-boundary mapping; the data do not isolate an ingredient or reveal prior financial knowledge.
  - statement: Process-group task-only, raw-context, and later translated-context batches each produced 0/8 accepted first passes.
    scope: Same frozen process-group fixture; A/B interleaved first, C run later; Q5 through Hermes CLI.
    evidence_paths:
      - notes/benchmarks/local-models/gx10-process-group-domain-context-pilot-2026-09-28.json
      - notes/benchmarks/local-models/gx10-process-group-translated-pilot-2026-09-28.json
    interpretation_limit: Later C timing cannot be ranked against A/B; first-pass failure does not prove a general reasoning ceiling.
unknown_or_unverified:
  - area: Organization-specific conventions and financial-document business semantics.
    handoff_action: Translate the minimum rule into data and code concepts, then verify positive and misleading cases.
  - area: Reliable implementation of unfamiliar process-lifecycle or other multi-step invariants.
    handoff_action: State the exact contract and boundary, use an independent verifier, and treat repeated failure as a route or capability question rather than adding unlimited explanation.
  - area: Transfer of these results to another model, transport, domain, or task size.
    handoff_action: Run a scoped probe before assuming transfer.
communication:
  direct_starting_vocabulary:
    - files and interfaces
    - APIs and process state
    - invariants and tests
  translate_or_probe:
    - unfamiliar business meaning behind input fields or document labels
    - specialized algorithmic invariants even when described in software terms
  verification_rule: Check the artifact against independent acceptance; prose and process exit do not establish correctness.
