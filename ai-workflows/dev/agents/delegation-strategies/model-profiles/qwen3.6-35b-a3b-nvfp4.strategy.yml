schema_version: local-coder-strategy.v1
applies_to:
  provider_model: qwen3.6-35b-a3b-nvfp4
strategy:
  default: focused-implementation
  transport: bounded-model
  output: proposal-only
assignment:
  preferred_scope: one-function-or-small-cohesive-change
  correction_limit_per_stage: 1
  require:
    - self-contained-relevant-code-excerpts
    - interfaces-and-callers-to-preserve
    - exact-input-output-and-rejection-examples
    - output-format-and-stop-condition
  limits:
    max_input_chars: 12000
    max_output_tokens: 2048
verification:
  owner: caller-and-independent-reviewer
  require:
    - inspect-code-against-every-example
    - run-focused-checks-on-accepted-code
    - execute-positive-and-negative-examples-through-command-runner-before-acceptance
    - reject-model-self-review-as-verification-evidence
    - inspect-visible-diff
  completion_text_alone_is_sufficient: false
evidence_notes: >-
  The 32K served window cannot initialize as a Hermes agent. On a matched amount-parser task with the original temperature-0 route, Q5 alone passed 8/13 cases and Q5 with this route passed 7/13. Official non-thinking sampling in the profile raised two launcher trials to 12/13 and 10/13 and one Hermes trial to 11/13, still variable and incomplete. Two precise-coding thinking trials exhausted 4096 output tokens without a final answer. In a later financial-records pilot, the original 2048-token route truncated broader proposals. A profile-owned increase to 4096 tokens and 120 seconds let a focused publication proposal finish, but its sidecar and path handling were unsafe. Other proposals invented extraction or omitted source-backed preview; a small recognition-class outline was useful only after Admin corrected context and classification checks. Keep proposal-only handoffs exact and small, inspect every returned invariant, and verify Admin-applied code independently.
