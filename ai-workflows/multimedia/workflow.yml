id: multimedia
label: Multimedia
tags:
  - multimedia
  - creative
entry: multimedia.workflow.md
frontend:
  type: iframe
  entry: /
backend:
  mode: process
  command: cd ../../ai-launcher && ./node_modules/.bin/ng build multimedia-workflow-ui --configuration production && ./node_modules/.bin/tsx --tsconfig ../ai-workflows/multimedia/multimedia-backend/tsconfig.json ../ai-workflows/multimedia/multimedia-backend/server/main.ts
  host: 127.0.0.1
  port: 5002
  health_path: /health
  shutdown_path: /shutdown
  shutdown_policy: stop
  shutdown_timeout_ms: 5000
  autostart: lazy
events:
  path: events
validations:
  - name: project-recommended
    trigger: workflow-loaded
    condition: no-scoped-projects
    event: workflow:project-recommended-missing-v1
    contribution: workflow-project-recommended-missing
    presenter: inline-center-advisory
    severity: warning
    label: Workflow project
    value: No project selected
    detail: Create or select a project for this workflow to load its project-specific workspace.
required_commands:
  - kdenlive
  - lyrics-timestamp
  - video-handwriting-effect
  - text-to-audio
  - voice-report
