schema_version: ai-fleas-model-expertise.v1
model_family: Qwen3-Coder-Next
applies_to:
  provider_models:
    - qwen3-coder-next-q5km
profile_status: evidence-backed-provisional
purpose: Guide delegation from observed work rather than assumed hidden knowledge.
education_reference: education.yml
communication:
  instruction_language:
    target_level: "concrete language understandable by a typical 12-year-old"
    rules:
      - "Use short sentences and common words."
      - "Give one instruction at a time when order matters."
      - "Prefer concrete actions such as read, check, compare, change, run, test, and stop."
      - "Avoid philosophical, academic, management, or process jargon when a simpler phrase says the same thing."
      - "Do not remove necessary technical terms such as file names, commands, APIs, framework names, errors, or code concepts. Explain the action around them simply."
      - "Use explicit IF/THEN and STOP rules for failure handling."
      - "Use examples when a rule can be misunderstood."
  observed_scope: Qwen3-Coder-Next Q5_K_M through the configured Stage-1 Hermes CLI Coder route; do not assume transfer to another deployment.
  direct_starting_language:
    - Give a named file and edit boundary, a source-to-target change, and the existing input/output contract directly.
    - Use concrete code and data terms such as function, representation, substring, whole word, result, and test case.
    - State a local invariant and its positive and misleading cases at the code boundary where it applies.
  translate_first:
    - Explain unfamiliar business labels or document meaning as properties of inputs and data representations.
    - For specialized lifecycle behavior, spell out state transitions, survivor cases, and cleanup obligations; familiar software words alone did not make implementation reliable here.
  observed_working_pattern:
    description: On the frozen recognizer, map normalizedText to boundary-preserving text and compactText to fuzzy search; contrast PAYMENT with REPAYMENT and point to the relevant code boundary.
    evidence: benchmarks/gx10/domain-context-three-arm-2026-09-28.json
    limit: The translated arm bundled analogy, examples, and code-boundary mapping; the experiment did not isolate which ingredient helped.
  observed_insufficient_pattern:
    description: Raw recognizer facts helped less than the translated package. On the process-group fixture, analogy, survivor example, exact invariant and explicit sequence still failed to produce reliable first-pass code.
    evidence:
      - benchmarks/gx10/domain-context-three-arm-2026-09-28.json
      - benchmarks/gx10/process-group-translated-pilot-2026-09-28.json
      - benchmarks/gx10/process-group-algorithm-2026-09-28.json
    limit: Output can reflect parts of an explanation while missing its combined invariant; internal understanding cannot be inferred from output.
  handoff_rule: "Use concrete instructions. Say what file/data/state matters, what must stay true, show one good example and one misleading/bad example, and point to the code boundary. Prefer short check/action/stop steps over abstract process language."
  debugging_rule: "CHECK BEFORE YOU CHANGE. Do not guess and then edit. Do not repeat a failed approach with small variations. Every action must either check something, test one clear explanation, or make one verified fix."
  debugging_steps:
    - "When something fails, do not edit code yet."
    - "Find the exact files and configuration involved."
    - "Write down what starts what, from the user's command to the thing that fails. Example: app.sh -> Angular server -> Electron -> browser window -> Angular files."
    - "Check what actually exists in the current Git branch. A local, generated, cached, or untracked file does not prove it exists in the branch."
    - "Before editing, write one sentence: I think X is broken because I observed Y."
    - "Make one change for that reason. Then test it."
    - "If it fails, use the new error as information. Do not repeat the same fix with different command options."
    - "If two fixes fail, STOP EDITING. Your understanding is probably wrong. Inspect the files, configuration, Git state, and errors again before another change."
    - "For a missing file or image, check in this order: requested URL -> configured source -> actual file -> Git branch -> generated/runtime output."
    - "Do not restart, rebuild, reinstall, or copy files unless a check shows why that action is needed."
    - "Do not say a file exists until you checked it. Do not say a tool cannot do something until you checked its configuration."
    - "Do not say the problem is fixed until you tested the real result."
    - "When the result is correct, STOP. Do not keep changing it."
  verification_rule: Check the artifact independently; completion prose, exit zero and even behavioral verification may miss source-level lifecycle flaws.
observed:
  demonstrated:
    - focused-file-edits
    - repository-tool-use
    - source-to-target-ports
  controlled_findings:
    - task: frozen-financial-recognizer
      first_pass_accepted: {task_only: "3/9", raw_domain: "5/9", translated_domain: "8/9"}
      evidence: benchmarks/gx10/domain-context-three-arm-2026-09-28.json
      interpretation_limit: One fixture does not prove prior financial knowledge or general domain fluency.
    - task: frozen-process-group-helper
      first_pass_accepted: {task_only: "0/8", raw_domain: "0/8", translated_domain: "0/8"}
      evidence:
        - benchmarks/gx10/process-group-domain-context-pilot-2026-09-28.json
        - benchmarks/gx10/process-group-translated-pilot-2026-09-28.json
      interpretation_limit: These failures do not prove a general reasoning ceiling.
    - task: reviewed-source-port
      accepted: "4/4"
      evidence: benchmarks/gx10/turn-cap-pilot-2026-09-28.json
      interpretation_limit: Porting a reviewed answer does not establish independent design skill.
  recurring_limits:
    - On a Screenshot Sorter Angular/Electron hot-reload task, the worker repeatedly patched launch symptoms before mapping the complete dev execution path; cheap static inspection of angular.json would have exposed the missing serve configuration earlier.
    - In integration debugging, the worker may commit prematurely to a causal explanation from one failed command instead of first inspecting manifests/configuration and testing the whole execution chain.
    - The worker needs an explicit stop-and-reassess trigger after repeated failed fixes; otherwise it can continue producing plausible progress-looking edits with low information gain.
    - On the same Screenshot Sorter task, after a broken hero image appeared, the worker asserted that the Angular public asset was already present and repeatedly restarted the dev server; the pushed branch had no hero.png in the configured public asset source while the canonical image remained in the legacy renderer assets directory.
    - When debugging missing files/assets, the worker may confuse local/untracked filesystem state with repository/branch truth and may restart/rebuild before verifying the requested URL-to-source mapping and tracked-file state.
    - Completion prose and process exit sometimes disagreed with independently checked code.
    - Repeated no-change patch calls and turn-limit stops occurred after a useful artifact was present.
    - Process-group candidates repeatedly failed descendant cleanup despite explicit handoff language.
inferred_but_unverified:
  - Software/data vocabulary may be a better default communication language than unexplained domain terminology.
  - Translation may unlock capability when an unfamiliar rule reduces to a local data/code invariant.
  - Process-group failure may involve multi-step implementation difficulty beyond communication.
unknown:
  - prior financial-document knowledge and organization-specific semantics
  - which translated recognizer ingredient produced the improvement
  - transfer to other tasks, domains, transports or deployments
  - reliable first-pass unfamiliar process-lifecycle implementation
  - representative long-context accepted-code performance
role_fit:
  provisional:
    - focused-coder
    - bounded-repository-worker
  conditional:
    - integration-debugger: requires investigate-first protocol and independent verification
  handoff_condition: Give exact write scope and independent acceptance; repeated failure after clear teaching becomes a route/capability question.
deployment_variants:
  - id: Q5_K_M
    note: deployment representation and runtime capacity are not experience
