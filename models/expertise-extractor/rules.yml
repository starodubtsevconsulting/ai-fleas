schema_version: ai-fleas-expertise-extractor-rules.v1
objective: make-model-representation-sufficiently-accurate-for-intended-use
not_objectives:
  - make-model-pass-every-task
  - optimize-runtime-by-default
  - infer-education-from-model-size-or-quantization
extractor_agent:
  role: teacher-experiment-designer-domain-translator-evaluator
  must:
    - understand-human-problem-independently-of-target
    - reason-at-higher-abstraction-level-for-profiling-objective
    - translate-between-domain-general-and-target-concepts
    - distinguish-communication-capability-runtime-and-verification-failures
    - design-discriminating-probes
    - preserve-uncertainty-and-contradictions
    - stop-teaching-when-communication-is-not-supported-as-root-cause
  must_not:
    - use-target-self-assessment-as-acceptance
    - invent-domain-correctness-when-not-grounded
    - optimize-probes-to-force-a-pass
  domain_grounding:
    require_authoritative_context_or_human_reviewer_when_extractor_lacks_domain_knowledge: true
  separation_of_duties:
    target_defines_acceptance: false
    independent_acceptance_required: true
phases:
  draft:
    source: public-upstream-information
    claims_are: declared-not-demonstrated
  evidence:
    source: controlled-observation
    claims_are: scoped-to-evidence
experiment:
  freeze:
    - starter
    - task
    - verifier
    - acceptance-criteria
  vary: one-meaningful-variable-at-a-time
  repeat_or_interleave_when_variance_matters: true
  independent_acceptance_required: true
  completion_prose_is_acceptance: false
  preserve_contradictions: true
  transfer_before_generalizing: true
claim_states:
  - confirmed
  - refined
  - contradicted
  - inferred-but-unverified
  - unknown
stopping:
  stop_when:
    - intended-role-questions-are-sufficiently-resolved
    - next-probe-is-unlikely-to-change-delegation-decision
  do_not_continue_merely_to:
    - achieve-a-pass
    - accumulate-more-benchmarks
profile_update:
  require:
    - evidence-path
    - task-and-deployment-scope
    - interpretation-limit
  never_silently_overwrite_contradictory_evidence: true
