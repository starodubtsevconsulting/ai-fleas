schema_version: gpt-agents-workflow-runtime.v2
platform: gpt-agents
workflow: dev
logical_project_pattern: <profile-id>-dev[-<suffix>]
initialization: ../../agents/initialization.md
portable_contract: ../../../../ai-workflows/agents.md
portable_manifest: ../../../../ai-workflows/dev/agents.yml
team_policy: ../../../../ai-workflows/dev/agents/team.md

# This file contains GPT/Codex realization only. The Router is hidden host
# infrastructure; each task is an independent role endpoint, not a peer.
# Optional `utility_delegates` in the profile-owned GPT command config are
# hidden, read-only helpers governed by the portable utility-subagents contract.
# They do not add role endpoints, saved-project tasks, or Router authority.
# For direct Hermes Coder requests and Admin-run Dev with `all-coder-work`,
# MUST use profile-owned `execution_delegates.dev.coder` as the real endpoint. MUST block on
# failed verification or delivery; MUST NOT emulate Coder or create a GPT task.
workflow_runtime:
  id: workflow-router
  visibility: hidden
  contract: ../../../../ai-workflows/_common/runtime/workflow-router.md
  workflow_source: ../../../../ai-workflows/dev/dev.workflow.md
  dispatch: exact-task-id-message
  result_observation: exact-task-turn-completion
  state: host-owned-per-workflow-run
  inspector: admin-only

role_endpoints:
  - role: admin
    title: "🔑 Admin"
    model: gpt-5.6-sol
    reasoning: high
  - role: designer-reviewer
    title: "💬 Designer Reviewer"
    model: gpt-5.6-sol
    reasoning: low
  - role: judge
    title: "⚖️ Judge"
    model: gpt-5.6-terra
    reasoning: low
  - role: manager
    title: "🤖 Manager"
    model: gpt-5.6-luna
    reasoning: medium
  - role: coder
    title: "🔀 Coder"
    model: gpt-5.6-terra
    reasoning: medium
  - role: command-runner
    title: "⚙️ Command Runner"
    model: gpt-5.6-terra
    reasoning: low
  - role: ui-acceptance-tester
    title: "🖥️ UI Acceptance Tester"
    model: gpt-5.6-terra
    reasoning: low

role_contracts:
  admin: ../../../../ai-workflows/_common/roles/admin.md
  designer-reviewer: ../../../../ai-workflows/_common/roles/designer-reviewer.md
  judge: ../../../../ai-workflows/_common/roles/judge.md
  manager: ../../../../ai-workflows/_common/roles/manager.md
  coder: ../../../../ai-workflows/_common/roles/coder.md
  command-runner: ../../../../ai-workflows/_common/roles/command-runner.md
  ui-acceptance-tester: ../../../../ai-workflows/_common/roles/ui-acceptance-tester.md

runtime_semantics:
  role_endpoint: user-visible-codex-task
  instance_id: app-returned-task-id
  logical_work_scope: profile-workflow-project-set
  primary_project: first-profile-workflow-project
  creation_environment: saved-project-local
  activate: create-and-initialize-task
  deactivate: recoverably-archive-exact-task-id
  router_delivery: exact-task-id-message
  result_return: host-observed-task-turn
  peer_delivery: prohibited
  external_bootstrap: create-human-designated-admin
