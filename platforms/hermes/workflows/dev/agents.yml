schema_version: hermes-workflow-agents.v1
platform: hermes
workflow: dev
runtime_object: hermes-profile
creation_environment: logical-agent-properties
# Hermes realizes the portable logical-agent contract. Provider selection is
# owned by ai-workflows/<workflow>/agents.yml (`aiProvider`), not by this adapter.
# This mapping only describes how logical roles become Hermes profiles.
bindings:
  - role: admin
    profile_suffix: admin
  - role: designer-reviewer
    profile_suffix: designer-reviewer
  - role: judge
    profile_suffix: judge
  - role: manager
    profile_suffix: manager
  - role: coder
    profile_suffix: coder
  - role: command-runner
    profile_suffix: command-runner
  - role: ui-acceptance-tester
    profile_suffix: ui-acceptance-tester
