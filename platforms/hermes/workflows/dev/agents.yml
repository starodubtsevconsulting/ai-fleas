schema_version: hermes-workflow-agents.v1
platform: hermes
workflow: dev
runtime_object: hermes-profile
creation_environment: profile-selected-provider
# Each Hermes agent has an explicit AI-provider property. The concrete provider
# alias is supplied by the active profile's workflow configuration so this
# reusable mapping remains portable.
bindings:
  - role: admin
    profile_suffix: admin
    ai_provider: profile
  - role: designer-reviewer
    profile_suffix: designer-reviewer
    ai_provider: profile
  - role: judge
    profile_suffix: judge
    ai_provider: profile
  - role: manager
    profile_suffix: manager
    ai_provider: profile
  - role: coder
    profile_suffix: coder
    ai_provider: profile
  - role: command-runner
    profile_suffix: command-runner
    ai_provider: profile
  - role: ui-acceptance-tester
    profile_suffix: ui-acceptance-tester
    ai_provider: profile
