# Generic Jira setting placeholders. Copy only secrets or machine-local settings
# to ignored jira.command.conf. Canonical organization/project values belong in
# the active profile's tracker execution configuration, not in this file.
JIRA_BASE_URL="https://jira.example.invalid"
JIRA_BROWSE_BASE_URL="https://jira.example.invalid/browse/"
JIRA_ISSUE_KEY_PATTERN="^[A-Z][A-Z0-9_]*-[0-9]+$"
JIRA_STORY_POINTS_FIELD_ID="customfield_10132"
JIRA_BROWSER_MODE="existing-chrome"
JIRA_CURRENT_SPRINT_BOARD_URL="https://jira.example.invalid/secure/RapidBoard.jspa?rapidView=0&projectKey=EXAMPLE&quickFilter=0"
JIRA_BROWSER_USER_DATA_DIR="$HOME/.jira/playwright-profile"
JIRA_BROWSER_CHANNEL="chrome"
JIRA_HEADLESS="false"
JIRA_AUTH_WAIT_MS="180000"
JIRA_ACTION_TIMEOUT_MS="30000"
JIRA_REVIEW_WAIT_MS="5000"
AI_CONFIG_REPO_URL="https://github.example.invalid/example-org/ai-config"
AI_CONFIG_JIRA_COMMAND_URL="https://github.example.invalid/example-org/ai-config/tree/main/ai-commands/jira"
# existing-chrome mode uses the front Chrome tab and requires JavaScript from Apple Events.
JIRA_DESCRIPTION_TEMPLATE_FILE="/absolute/path/to/profile-owned-jira-template.txt"
