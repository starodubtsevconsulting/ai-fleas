provider:
  model_count: 1
  autostart: true

api:
  protocol: http
  authentication: none
  api_key: none

network:
  exposure: lan

service:
  manager: systemd
  listen_address: 0.0.0.0
  port: 8080
  name: ai-local-provider
  restart: on-failure

notes:
  - Quantized from the Apache-2.0 Qwen3.5 9B model and pinned by artifact checksum.
  - The model has a native 262K context; this preset exposes a real 64K window required by Hermes Agent.
  - All model layers are targeted to CUDA and Q8 key/value caches are used for a 12 GiB GPU budget.
  - One inference slot prevents duplicate KV caches from exceeding VRAM.
  - HTTP without authentication is intended only for a trusted LAN and must not be exposed to the public Internet by default.
