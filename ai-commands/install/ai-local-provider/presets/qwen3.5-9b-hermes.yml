model:
  source: huggingface
  repository: unsloth/Qwen3.5-9B-GGUF
  file: Qwen3.5-9B-Q4_K_M.gguf
  api_alias: qwen3.5-9b-q4_k_m
  sha256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
  size_bytes: 5680522464
  quantization: Q4_K_M
  context: 65536

runtime:
  type: llama.cpp
  source_repository: https://github.com/ggml-org/llama.cpp.git
  source_revision: 8ea290247c87ced2ab245b056ffe96dbcf90d36c
  gpu_layers: 99
  cache_key_type: q8_0
  cache_value_type: q8_0
