<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote Desktop Launcher</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;--bg:#0b1020;--panel:#151c31;--line:#2b385b;--text:#f4f7ff;--muted:#9ca9c8;--blue:#75a7ff;--green:#4dde9d;--red:#ff7e91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#1d315d 0,transparent 42%),var(--bg);color:var(--text)}header{padding:34px 38px 24px}h1{margin:0;font-size:30px}header p{color:var(--muted);margin:8px 0 0}main{padding:0 38px 38px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);padding:20px;cursor:pointer}.card.selected{border-color:var(--blue);box-shadow:0 0 0 2px #75a7ff33}.name{font-size:20px;font-weight:750}.host,.note{color:var(--muted);font-size:13px;margin-top:6px}.status{color:var(--green);font-size:12px;margin-top:14px}.controls{margin-top:18px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--panel);display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;color:var(--muted);font-size:12px}select,input,button{font:inherit;border:1px solid var(--line);border-radius:10px;background:#0e1528;color:var(--text);padding:11px 12px}button{cursor:pointer;background:var(--blue);color:#071126;font-weight:800;border:0}.secondary{background:#273451;color:var(--text)}.warning{color:#ffd184;font-size:12px}.error{color:var(--red);font-size:13px;min-height:18px}.empty{color:var(--muted);padding:30px;border:1px dashed var(--line);border-radius:16px}
</style></head><body><header><h1>Remote Desktop</h1><p>Choose a profile-configured machine and connection experience.</p></header><main><section id="targets" class="grid"></section><section id="controls" class="controls" hidden><div class="row"><label>Client<select id="client"><option value="freerdp">FreeRDP — compatible</option><option value="windows-app">Windows App</option></select></label><label>Display<select id="display"><option value="fullscreen">Fullscreen, dynamic</option><option value="window">Window</option></select></label></div><div class="row"><label>Window size<select id="size"><option value="large">1920 × 1200</option><option value="standard">1440 × 900</option></select></label><label>RDP password<input id="password" type="password" autocomplete="off" placeholder="Not stored"></label></div><div id="warning" class="warning"></div><button id="connect">Connect</button><button id="openWindows" class="secondary">Open Windows App only</button><div id="error" class="error"></div></section></main><script>
const ui={targets:document.getElementById('targets'),controls:document.getElementById('controls'),client:document.getElementById('client'),display:document.getElementById('display'),size:document.getElementById('size'),password:document.getElementById('password'),warning:document.getElementById('warning'),connect:document.getElementById('connect'),openWindows:document.getElementById('openWindows'),error:document.getElementById('error')};let targets=[],selected;
function esc(v){const e=document.createElement('span');e.textContent=String(v||'');return e.innerHTML}function render(){ui.targets.innerHTML=targets.length?targets.map(t=>`<article class="card ${selected?.id===t.id?'selected':''}" data-id="${esc(t.id)}"><div class="name">${esc(t.label)}</div><div class="host">${esc(t.username)} @ ${esc(t.host)}</div><div class="note">${esc(t.note)}</div><div class="status">● Profile configured</div></article>`).join(''):'<div class="empty">No remote desktop machines are configured in this profile.</div>';ui.controls.hidden=!selected;if(selected){ui.client.value=selected.preferredClient;update()}}
function update(){if(!selected)return;const windows=ui.client.value==='windows-app';ui.password.disabled=windows;ui.display.disabled=windows;ui.size.disabled=windows||ui.display.value==='fullscreen';ui.warning.textContent=windows&&!selected.windowsAppCompatible?'Windows App is known to show a black screen for this GNOME remote-login target.':''}
ui.targets.onclick=e=>{const card=e.target.closest('[data-id]');if(!card)return;selected=targets.find(t=>t.id===card.dataset.id);render()};ui.client.onchange=update;ui.display.onchange=update;ui.openWindows.onclick=()=>window.remoteDesktop.openWindowsApp();ui.connect.onclick=async()=>{ui.error.textContent='';try{await window.remoteDesktop.connect({targetId:selected.id,client:ui.client.value,display:ui.display.value,size:ui.size.value,password:ui.password.value});ui.password.value=''}catch(e){ui.error.textContent=e.message}};window.remoteDesktop.targets().then(items=>{targets=items;selected=items[0];render()});
</script></body></html>
