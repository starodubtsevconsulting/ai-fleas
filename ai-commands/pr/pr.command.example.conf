# Example config for pr.command
REVIEWERS="schaturvedi,sshapiro"
BASE_BRANCH="master"
OPEN_PR_IN_BROWSER="true"

# Optional alternate SCM support (used only when remote.origin.url host matches your configured SCM host).
# Prefer environment variables for secrets, or put this in local pr.command.conf if needed.
BITBUCKET_BASE_URL="https://scm.example.com"
BITBUCKET_USERNAME="your-bitbucket-username"
BITBUCKET_TOKEN="your-bitbucket-token-or-password"
BITBUCKET_REVIEWERS="reviewer1,reviewer2"
