<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare Tunnels</title><style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--orange:#f6821f;--green:#3fb950;--red:#f85149;--blue:#58a6ff;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{display:flex;align-items:center;justify-content:space-between;padding:22px 28px;border-bottom:1px solid var(--border)}h1,h2,p{margin:0}.brand{display:flex;gap:14px;align-items:center}.mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--orange);color:#111;font-weight:900}.muted{color:var(--muted);font-size:13px;margin-top:4px}.content{padding:22px 28px;display:grid;gap:18px}.context,.target,.logs{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:16px}.context{display:flex;gap:12px;align-items:end}.field{flex:1}.label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}select,button{font:inherit;min-height:38px;border:1px solid var(--border);border-radius:8px;background:#1c232d;color:var(--text);padding:0 14px}select{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:var(--orange);color:#17100a;font-weight:750}.danger{color:#ffb4af}.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.target-head,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.target h2{font-size:17px;overflow-wrap:anywhere}.state{margin:18px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border-top:1px solid var(--border);padding-top:12px}.value{font-weight:700;margin-top:6px}.ok{color:var(--green)}.bad{color:var(--red)}.url{color:var(--blue);font:13px ui-monospace,monospace;overflow-wrap:anywhere}.buttons{display:flex;gap:8px;flex-wrap:wrap}.logs pre{max-height:220px;overflow:auto;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:#c9d1d9}
</style></head><body><header><div class="brand"><div class="mark">CF</div><div><h1>Multi-provider tunnel controller</h1><p class="muted">Independent Cloudflare Access protected connectors</p></div></div><button id="refresh">Refresh all</button></header><main class="content"><section class="context"><label class="field"><span class="label">Profile and workflow</span><select id="context"></select></label><button id="useContext">Use profile</button></section><section id="targets" class="targets"></section><section class="logs"><div class="row"><span class="label">Connector logs</span><span class="muted">Tokens are redacted</span></div><pre id="log">Each provider target has independent lifecycle controls.</pre></section></main><script>
const ui={context:document.getElementById('context'),useContext:document.getElementById('useContext'),targets:document.getElementById('targets'),log:document.getElementById('log')};
let states=[];
function esc(v){const e=document.createElement('span');e.textContent=String(v||'');return e.innerHTML}
function card(s){const running=s.connectorManaged;return `<article class="target" data-provider="${esc(s.providerId)}"><div class="target-head"><div><span class="label">Model provider</span><h2>${esc(s.providerId)}</h2></div><span class="${running?'ok':'bad'}">${running?'● Open':'● Closed'}</span></div><div class="state"><div class="metric"><span class="label">Configuration</span><div class="value ${s.configured?'ok':'bad'}">${s.configured?'Valid':'Needs attention'}</div></div><div class="metric"><span class="label">Access gate</span><div class="value ${s.accessHealthy?'ok':'bad'}">${s.accessHealthy?'Protected':'Not verified'}</div></div><div class="metric"><span class="label">Connector</span><div class="value">${running?'Managed here':'Stopped'}</div></div></div><p class="url">${esc(s.publicUrl||s.message||'Unavailable')}</p><div class="buttons" style="margin-top:16px"><button class="primary start" ${running||!s.configured?'disabled':''}>Start</button><button class="danger stop" ${!running?'disabled':''}>Stop</button><button class="open" ${!s.publicUrl?'disabled':''}>Open URL</button></div></article>`}
function render(items){states=items;ui.targets.innerHTML=items.length?items.map(card).join(''):'<article class="target">No provider tunnel targets configured.</article>';ui.context.disabled=items.some(x=>x.connectorManaged);ui.useContext.disabled=ui.context.disabled}
async function refresh(){try{render(await window.cloudflareTunnel.targets())}catch(e){ui.log.textContent+=`\n${e.message}`}}
ui.targets.addEventListener('click',async e=>{const card=e.target.closest('[data-provider]');if(!card)return;const id=card.dataset.provider;try{if(e.target.classList.contains('start'))await window.cloudflareTunnel.start(id);if(e.target.classList.contains('stop'))await window.cloudflareTunnel.stop(id);if(e.target.classList.contains('open'))await window.cloudflareTunnel.openPublicUrl(id);await refresh()}catch(error){ui.log.textContent+=`\n[${id}] ${error.message}`}});
async function contexts(){const r=await window.cloudflareTunnel.contexts();ui.context.replaceChildren(...r.contexts.map(x=>{const o=document.createElement('option');o.value=JSON.stringify(x);o.textContent=`${x.profileId} — ${x.workflow}`;o.selected=x.profileId===r.selected?.profileId&&x.workflow===r.selected?.workflow;return o}))}
document.getElementById('refresh').onclick=refresh;ui.useContext.onclick=async()=>{const r=await window.cloudflareTunnel.selectContext(JSON.parse(ui.context.value));render(r.targets)};window.cloudflareTunnel.onLog(line=>{ui.log.textContent+=`\n${line}`;ui.log.scrollTop=ui.log.scrollHeight});contexts().then(refresh);setInterval(refresh,5000);
</script></body></html>
