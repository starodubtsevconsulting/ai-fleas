<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudflare Tunnels</title><style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#f0f6fc;--muted:#8b949e;--orange:#f6821f;--green:#3fb950;--red:#f85149;--blue:#58a6ff;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden}header{height:78px;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border)}h1,h2,p{margin:0}.brand{display:flex;gap:12px;align-items:center}.mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--orange);color:#111;font-weight:900}.muted{color:var(--muted);font-size:12px;margin-top:3px}.content{height:calc(100vh - 78px);padding:14px 24px;display:flex;flex-direction:column;gap:10px;min-height:0}.context,.targets,.logs{border:1px solid var(--border);border-radius:11px;background:var(--panel)}.context{display:flex;gap:10px;align-items:end;padding:11px;flex:none}.field{flex:1}.label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}select,button{font:inherit;min-height:32px;border:1px solid var(--border);border-radius:7px;background:#1c232d;color:var(--text);padding:0 11px}select{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{background:var(--orange);color:#17100a;font-weight:750}.danger{color:#ffb4af}.targets{flex:1;min-height:110px;overflow-y:auto}.target{display:grid;grid-template-columns:minmax(210px,1.35fr) repeat(3,minmax(90px,.65fr)) minmax(190px,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}.target:last-child{border-bottom:0}.target h2{font-size:14px;overflow-wrap:anywhere}.value{font-size:13px;font-weight:700}.ok{color:var(--green)}.bad{color:var(--red)}.url{min-height:auto;padding:0;border:0;background:transparent;color:var(--blue);font:12px ui-monospace,monospace;text-align:left;overflow-wrap:anywhere}.url:hover{text-decoration:underline}.buttons{display:flex;gap:7px}.splitter{height:8px;flex:none;cursor:row-resize;position:relative}.splitter:after{content:"";position:absolute;left:calc(50% - 32px);top:3px;width:64px;height:2px;border-radius:2px;background:#484f58}.logs{height:45%;min-height:42px;display:grid;grid-template-rows:40px minmax(0,1fr);overflow:hidden;flex:none}.log-head{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--border);min-width:0}.log-head .label{margin:0;flex:none}.log-filters{display:flex;gap:5px;overflow-x:auto;flex:1;padding:5px 0}.filter{min-height:27px;padding:0 9px;white-space:nowrap;font-size:11px}.filter.active{border-color:var(--orange);color:var(--orange);background:#2b2119}.log-actions{display:flex;align-items:center;gap:7px;flex:none}.toggle{min-height:27px;padding:0 9px}.logs pre{margin:0;padding:10px 12px;overflow:auto;white-space:pre-wrap;font:11px/1.45 ui-monospace,monospace;color:#c9d1d9}.logs.collapsed{height:42px!important}.logs.collapsed pre{display:none}@media(max-width:900px){.target{grid-template-columns:1fr 1fr 1fr}.provider,.target .url,.buttons{grid-column:span 3}.log-actions .muted{display:none}}
</style></head><body><header><div class="brand"><div class="mark">CF</div><div><h1>Multi-provider tunnel controller</h1><p class="muted">Independent Cloudflare Access protected connectors</p></div></div><button id="refresh">Refresh all</button></header><main id="content" class="content"><section class="context"><label class="field"><span class="label">Profile and workflow</span><select id="context"></select></label><button id="useContext">Use profile</button></section><section id="targets" class="targets"></section><div id="splitter" class="splitter" role="separator" aria-label="Resize connector logs"></div><section id="logs" class="logs"><div class="log-head"><span class="label">Connector logs</span><div id="logFilters" class="log-filters"></div><span class="log-actions"><span class="muted">Tokens are redacted</span><button id="toggleLogs" class="toggle">Collapse</button></span></div><pre id="log"></pre></section></main><script>
const ui={content:document.getElementById('content'),context:document.getElementById('context'),useContext:document.getElementById('useContext'),targets:document.getElementById('targets'),logs:document.getElementById('logs'),splitter:document.getElementById('splitter'),toggleLogs:document.getElementById('toggleLogs'),logFilters:document.getElementById('logFilters'),log:document.getElementById('log')};
let states=[],logLines=[{providerId:'',line:'Each provider target has independent lifecycle controls.'}],logFilter='all';
function esc(v){const e=document.createElement('span');e.textContent=String(v||'');return e.innerHTML}
function card(s){const running=s.connectorManaged;return `<article class="target" data-provider="${esc(s.providerId)}"><div class="provider"><span class="label">Model provider</span><h2>${esc(s.providerId)}</h2></div><div><span class="label">State</span><div class="value ${running?'ok':'bad'}">${running?'● Open':'● Closed'}</div></div><div><span class="label">Configuration</span><div class="value ${s.configured?'ok':'bad'}">${s.configured?'Valid':'Needs attention'}</div></div><div><span class="label">Access</span><div class="value ${s.accessHealthy?'ok':'bad'}">${s.accessHealthy?'Protected':'Not verified'}</div></div><button class="url open" ${!s.publicUrl?'disabled':''}>${esc(s.publicUrl||s.message||'Unavailable')}</button><div class="buttons"><button class="primary start" ${running||!s.configured?'disabled':''}>Start</button><button class="danger stop" ${!running?'disabled':''}>Stop</button></div></article>`}
function renderFilters(){const ids=states.map(s=>s.providerId);if(logFilter!=='all'&&!ids.includes(logFilter))logFilter='all';ui.logFilters.innerHTML=['all',...ids].map(id=>`<button class="filter ${id===logFilter?'active':''}" data-filter="${esc(id)}">${id==='all'?'All':esc(id)}</button>`).join('')}
function renderLogs(){const lines=logFilter==='all'?logLines:logLines.filter(x=>x.providerId===logFilter);ui.log.textContent=lines.map(x=>x.line).join('\n');ui.log.scrollTop=ui.log.scrollHeight}
function addLog(line,providerId=''){logLines.push({providerId,line:String(line)});if(logLines.length>2000)logLines=logLines.slice(-2000);renderLogs()}
function render(items){states=items;ui.targets.innerHTML=items.length?items.map(card).join(''):'<article class="target">No provider tunnel targets configured.</article>';ui.context.disabled=items.some(x=>x.connectorManaged);ui.useContext.disabled=ui.context.disabled;renderFilters();renderLogs()}
async function refresh(){try{render(await window.cloudflareTunnel.targets())}catch(e){addLog(e.message)}}
ui.targets.addEventListener('click',async e=>{const card=e.target.closest('[data-provider]');if(!card)return;const id=card.dataset.provider;try{if(e.target.classList.contains('start'))await window.cloudflareTunnel.start(id);if(e.target.classList.contains('stop'))await window.cloudflareTunnel.stop(id);if(e.target.classList.contains('open'))await window.cloudflareTunnel.openPublicUrl(id);await refresh()}catch(error){addLog(`[${id}] ${error.message}`,id)}});
ui.logFilters.onclick=e=>{const button=e.target.closest('[data-filter]');if(!button)return;logFilter=button.dataset.filter;renderFilters();renderLogs()};
async function contexts(){const r=await window.cloudflareTunnel.contexts();ui.context.replaceChildren(...r.contexts.map(x=>{const o=document.createElement('option');o.value=JSON.stringify(x);o.textContent=`${x.profileId} — ${x.workflow}`;o.selected=x.profileId===r.selected?.profileId&&x.workflow===r.selected?.workflow;return o}))}
document.getElementById('refresh').onclick=refresh;ui.useContext.onclick=async()=>{const r=await window.cloudflareTunnel.selectContext(JSON.parse(ui.context.value));render(r.targets)};ui.toggleLogs.onclick=()=>{const collapsed=ui.logs.classList.toggle('collapsed');ui.splitter.hidden=collapsed;ui.toggleLogs.textContent=collapsed?'Expand':'Collapse'};ui.splitter.onpointerdown=e=>{e.preventDefault();ui.splitter.setPointerCapture(e.pointerId);const move=event=>{const box=ui.content.getBoundingClientRect();const height=Math.max(90,Math.min(box.height-150,box.bottom-event.clientY));ui.logs.style.height=`${height}px`};ui.splitter.onpointermove=move;ui.splitter.onpointerup=()=>{ui.splitter.onpointermove=null;ui.splitter.onpointerup=null}};window.cloudflareTunnel.onLog(line=>{const match=String(line).match(/^\[([^\]]+)\]/);addLog(line,match?match[1]:'')});contexts().then(refresh);setInterval(refresh,5000);
</script></body></html>
