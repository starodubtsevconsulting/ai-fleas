name: logs
command: logs.command.sh
description: Inspect service logs on remote servers for specific apps
category: system
ai:
  powered: false
  roles:
    - devops
intent:
  - "show me logs"
  - "check logs"
  - "inspect logs"
  - "monitor logs"
  - "view recent errors"
  - "what happened today"
config:
  - name: default_since
    type: string
    default: yesterday
    description: Default time range for log queries
  - name: ssh_user
    type: string
    default: sergii
    description: SSH user for remote connections
requirements:
  - ssh
  - journalctl (remote)
  - grep
app_mapping:
  sc-website:
    service: umbrella-v2.service
    log_path: /home/sergii/projects/sc/sc-services
  chaletwhisper:
    service: umbrella-v2.service
    log_path: /home/sergii/projects/sc/sc-services
  locusesse:
    service: locusesse-local.service
    log_path: /home/sergii/projects/sc/sc-services
  ai-fleas:
    service: umbrella-v2.service
    log_path: /home/sergii/projects/sc/sc-services
