<article class="shot" [title]="shot.name">
  <img [src]="thumbnail" [alt]="shot.name" style="cursor: pointer;" (click)="openScreenshot.emit()">
  <div class="shot-name">{{ shot.name }}</div>
  <div class="shot-meta">{{ formatModified(shot.modifiedAt) }} · {{ formatBytes(shot.bytes) }}</div>
  <div class="shot-actions">
    <button class="folder" (click)="openFolder.emit()" aria-label="Open folder in Finder">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>
</article>
