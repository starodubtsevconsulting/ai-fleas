# EXAMPLE ONLY: sanitized GPT Agents command binding with no operational project or task IDs.
schema_version: gpt-agents-command-config.v1
capability: gpt-agents
registered_command: gpt-agents
command_path: gpt-agents/gpt-agents.command.md
platform: codex-app
lifecycle:
  creation_environment: saved-project-local
  preserve_history: true
  require_exact_instance_receipts: true
  archive_is_recoverable: true
grouping:
  project_name_template: '{profile}-{workflow}{suffix}'
  suffix_separator: '-'
  collision_policy: increment
  reuse_requires_recorded_project_id: true

# Portable workflow rules do not select a model. This example explicitly chooses
# the same low-reasoning writing settings as the GPT overlay; profiles may tune them.
role_overrides:
  smoke-tester: { model: gpt-5.6-terra, reasoning: low }
  writer: { model: gpt-5.6-terra, reasoning: low }
  reviewer: { model: gpt-5.6-sol, reasoning: low }
  release-coordinator: { model: gpt-5.6-terra, reasoning: low }

# Optional example only. A real profile must select its own Coder profile,
# authorized projects, routing policy, transport, and matching strategy.
# This example does not establish a command-level or platform-wide default.
# Supported transport values: cli-oneshot or a2a. Pair the selected value with
# its matching transport strategy in strategy_transport_config:
#   cli-oneshot -> dev/agents/delegation-strategies/transports/hermes-cli-oneshot.strategy.yml
#   a2a         -> dev/agents/delegation-strategies/transports/hermes-a2a.strategy.yml
# Supported routing_policy values: explicit-only or all-coder-work.
# Model names in role_overrides and delegate profile IDs depend on the host and
# selected profile; the illustrative values here are not an allowed-value list.
execution_delegates:
  dev:
    coder:
      id: example-hermes-coder
      platform: hermes-cli
      profile: example-dev-coder
      transport: cli-oneshot
      strategy_transport_config: dev/agents/delegation-strategies/transports/hermes-cli-oneshot.strategy.yml
      # Used when transport is a2a; replace these illustrative endpoint details
      # with the selected profile's live Hermes agent connection.
      a2a:
        endpoint: http://127.0.0.1:9901/
        agent_name: example-dev-coder
      launcher: example-hermes-coder-delegate.sh
      projects: [example-service]
      default_project: example-service
      route: admin-to-real-coder
      preferred: true
      routing_policy: explicit-only
      authorization: direct-delegation-or-admin-dev-run
      toolsets: [file]
