# EXAMPLE ONLY: sanitized GPT Agents command binding with no operational project or task IDs.
schema_version: gpt-agents-command-config.v1
capability: gpt-agents
registered_command: gpt-agents
command_path: gpt-agents/gpt-agents.command.md
platform: gpt-agents
lifecycle:
  creation_environment: saved-project-local
  preserve_history: true
  require_exact_instance_receipts: true
  archive_is_recoverable: true
binding_state:
  owner: profile
  path: .local/gpt-agents/bindings.yml
  schema_version: gpt-agents-binding-state.v1
grouping:
  project_name_template: '{profile}-{workflow}{suffix}'
  suffix_separator: '-'
  collision_policy: increment
  reuse_requires_recorded_project_id: true

# Platform defaults come from the GPT Agents role/workflow overlays.
# Add role_overrides only when this profile intentionally differs from those defaults.
role_overrides: {}
