# EXAMPLE ONLY: realistic shape with fictional, non-operational values. Never use this as a real host configuration.
# Keep the populated copy in the operational AI Profile and ignored by Git.
schema_version: local-ai-providers.v1
capability: hermes
registered_command: hermes
command_path: hermes/hermes.command.sh

profile_defaults:
  name_template: example-{workflow}-{project}
  preserve_conversations: true

# A provider is a stable target ID for a computer, service, or cloud endpoint.
# Add another entry when another model box is introduced; workflows select the
# target by ID and never need to embed its address.
providers:
  - id: example-model-box
    label: Example model box
    location:
      kind: lan
      label: Example model box
    protocol: openai-compatible
    endpoint:
      url: http://192.0.2.10:1234/v1
      environment_variable: EXAMPLE_HERMES_ENDPOINT
    authentication:
      type: none
      credential_environment_variable: EXAMPLE_HERMES_API_KEY
    models:
      # This alias is stable even if the provider's installed model ID changes.
      - id: example-coder
        label: Example coder model
        provider_model: example-coder-model
        capabilities:
          - coding
        hermes:
          context_window_tokens: 65536
          compression_threshold: 0.25
          compression_target: 0.15
          protect_last_messages: 8

command_access:
  root: ${AI_COMMANDS_ROOT}
  inherit_workflow_commands: true

# Real addresses, credentials, and machine-specific paths belong only in an
# operational profile. A workflow selects this map with:
# local_ai: { providers_config: <this file>, provider: example-model-box, model: example-coder }
