# Example profile-owned configuration for the provider-neutral `secrets` capability.
#
# This file intentionally contains fictional/non-routable values and secret references only.
# Real profile names, infrastructure names, domains, machine identities, mappings, and
# credential values belong in the user's private profile/configuration surface.
# `secrets inspect` reads this mapping as metadata without provider access.
provider: infisical
endpoint: https://secrets.example.invalid

# Provider-specific runtime details are selected here, while workflows and other
# commands depend only on the portable `secrets` capability.
provider_config:
  project_id: 00000000-0000-4000-8000-000000000000
  environment: dev
  machine_identity: example-runtime
  # A protected mode-0600 local file contains INFISICAL_CLIENT_ID and
  # INFISICAL_CLIENT_SECRET. It is never committed or copied into prompts.
  bootstrap_file: /absolute/private/example-infisical-bootstrap.env
  # Optional when the endpoint is protected by Cloudflare Access:
  # access_bootstrap_file: /absolute/private/example-access-bootstrap.env

# Logical names are stable profile-facing references. Values are resolved by the
# configured backend at execution time and must never be committed here.
secrets:
  example.dev.integration.api-token:
    ref: ${secret:example.dev.integration.api-token}
    backend:
      path: /example/integrations
      key: api_token
  example.dev.lodgify.api-key:
    ref: ${secret:example.dev.lodgify.api-key}
    backend:
      path: /example/integrations
      key: lodgify_api_key
  example.dev.synology.admin-username:
    ref: ${secret:example.dev.synology.admin-username}
    backend:
      path: /
      key: admin_username
  example.dev.synology.admin-password:
    ref: ${secret:example.dev.synology.admin-password}
    backend:
      path: /
      key: admin_password
  example.dev.synology.financial-memory-username:
    ref: ${secret:example.dev.synology.financial-memory-username}
    backend:
      path: /
      key: financial_memory_username
  example.dev.synology.financial-memory-password:
    ref: ${secret:example.dev.synology.financial-memory-password}
    backend:
      path: /
      key: financial_memory_password
  example.dev.synology.articles-username:
    ref: ${secret:example.dev.synology.articles-username}
    backend:
      path: /
      key: articles_username
  example.dev.synology.articles-password:
    ref: ${secret:example.dev.synology.articles-password}
    backend:
      path: /
      key: articles_password
# Consumers receive only the variables they declare, in the child process that
# runs the command. The parent agent, prompts, reports, and durable memory do
# not receive resolved values.
command_injection:
  cloudflare:
    executable: connect/cloudflare/cloudflare.command.sh
    environment:
      EXAMPLE_CLOUDFLARE_API_TOKEN:
        logical_secret: example.dev.integration.api-token
  lodgify:
    executable: connect/lodgify/lodgify.command.sh
    environment:
      LODGIFY_API_KEY:
        logical_secret: example.dev.lodgify.api-key
  synology:
    executable: connect/synology/synology.command.sh
    environment:
      SYNOLOGY_ADMIN_USERNAME:
        logical_secret: example.dev.synology.admin-username
      SYNOLOGY_ADMIN_PASSWORD:
        logical_secret: example.dev.synology.admin-password
  synology-memory:
    executable: connect/synology-memory/synology-memory.command.sh
    environment:
      SYNOLOGY_SHARE_USERNAME:
        logical_secret: example.dev.synology.articles-username
      SYNOLOGY_SHARE_PASSWORD:
        logical_secret: example.dev.synology.articles-password

policy:
  inject_at_execution_time: true
  delivery_scope: child-process-only
  persist_values_in_git: false
  persist_values_in_memory: false
  log_values: false
