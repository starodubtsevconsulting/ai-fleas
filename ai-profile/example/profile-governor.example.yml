schemaVersion: profile-agent-binding.v1

agentId: personal-governor
roleDefinition: ../../ai-workflows/_common/roles/personal-governor.yml
scope: governed-human
lifecycle: persistent
humanFacing: true
readinessToken: PERSONAL_GOVERNOR_READY
aiBinding: profile-default

# Illustrative conversation calibration; not a universal default.
agreeableness:
  level: medium
  strategy: evidence_based_independent_judgment
  modes:
    conversation: { challenge: low, behavior: listen_explore_clarify }
    exploration: { challenge: medium, behavior: test_assumptions_and_alternatives }
    decision: { challenge: high, behavior: examine_evidence_durability_tradeoffs }
    execution: { challenge: conditional, behavior: follow_authorized_instructions_and_flag_conflicts }
  principles:
    - agreement_must_be_earned
    - disagreement_must_be_reasoned
    - uncertainty_is_valid
    - distinguish_thinking_aloud_from_commitment
    - do_not_manufacture_opposition
    - human_retains_authority


subject:
  id: jonathan-example
  name: Jonathan Example
  coordinates:
    email: jonathan@example.invalid

governorStrategy:
  id: default
  strategyVersion: v1
  humanVersion: v1
  methodSettings:
    monthly-plan-reality-reconciliation:
      enabled: true
      method: ../../ai-workflows/_common/roles/personal-governor/methods/monthly-plan-reality-reconciliation/v1.md
      cadence: 1mo
      baseline: immutable-after-human-acceptance
      currentPlan: living
      monthEndReview: required
      deviationReasons: evidence-based
    external-feedback-loop:
      enabled: true
      method: ../../ai-workflows/_common/roles/personal-governor/methods/external-feedback-loop/v1.md
      professionalPublicProfileMaintenance:
        enabled: true
        contextProfile: example
        sources:
          - id: cv
            url: https://example.invalid/profiles/jonathan-example
          - id: professional-site
            url: https://example.invalid/jonathan
        reviewTrigger: relevant-goal-or-opportunity
        publication: human-reviewed
  data:
    strategy:
      uri: profile-memory://governor/strategy
      access: read-write
      privacy: profile-private
    human:
      uri: profile-memory://governor/human
      access: read-write
      privacy: profile-private

dailyPlanningSync:
  method: ../../ai-workflows/_common/roles/personal-governor/methods/daily-planning-sync/v1.md
  preferredWindow:
    start: "08:00"
    duration: 30m
  # Example timing demonstrates configuration only; the portable method does not require morning.

dayPlanning:
  strategy: fixed-schedule-time-blocking
  strategyRef: ../../ai-workflows/_common/policy/day-planning/fixed-schedule-time-blocking.md
  overlays:
    - id: recovery-constrained
      strategyRef: ../../ai-workflows/_common/policy/day-planning/recovery-constrained.md
      activation: evidence-based
  # Personal clock times and capacity assumptions belong in the private profile.
  # Example profiles demonstrate the contract without prescribing a universal schedule.

calendarAccess:
  command: calendar
  structuredProviderPreferred: true
  browserFallback:
    enabled: true
    command: browser
    allowExternalBrowser: true
    externalWhenInternalUnavailableOrUnreliable: true
  # The calendar command loads its command-owned operational skill. This binding only
  # authorizes and tunes access; it does not duplicate the reusable skill instructions.

goals:
  - id: improve-ai-tool-proficiency
    intent: Become proficient with AI tools used in routine work.
    status: active
    priority: high
    workflows: [dev]
  - id: improve-work-efficiency
    intent: Reduce repeated manual work and improve delivery efficiency with appropriate automation.
    status: active
    priority: medium
    workflows: [dev]

reviewSchedule:
  enabled: true
  every: 1w
  purpose: Review goal alignment and advise the governed human only when a meaningful adjustment is justified.

memory:
  - name: decision-history
    uri: profile-memory://decision-history
    purpose: Durable historical decision log.
    access: read-write
    privacy: profile-private
    precedence: historical
  - name: project-context
    uri: profile-memory://project-context
    purpose: Read-only supporting project and workflow context.
    access: read-only
    privacy: profile-private

commands:
  - calendar
  - browser
  - messaging
  - email

goalRehearsal:
  method: ../../ai-workflows/_common/roles/personal-governor/methods/goal-rehearsal/v1.md
  cadence: 1w
  languages: [en, fr]
  # Rehearsal keeps important goals understood and communicable; cadence and languages are human-specific configuration.
