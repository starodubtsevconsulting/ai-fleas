schemaVersion: profile-agent-binding.v1

agentId: cross-workflow-governor
roleDefinition: ../../ai-workflows/_common/roles/cross-workflow-governor.yml
scope: profile
lifecycle: persistent
humanFacing: true
readinessToken: CROSS_WORKFLOW_GOVERNOR_READY
aiProvider: profile-default

profile:
  id: example

subject:
  id: jonathan-example
  name: Jonathan Example
  coordinates:
    email: jonathan@example.invalid

# Strategy coordinates are explicit. The strategy family and its two components
# may evolve independently; a concrete Governor chooses exactly what it follows.
governorStrategy:
  id: default
  strategyVersion: v1
  humanVersion: v1

workflows:
  - dev

goals:
  - id: improve-ai-tool-proficiency
    intent: Become proficient with AI tools used in routine work.
    status: active
    priority: high
    workflows:
      - dev
    successSignals:
      - Common AI-assisted tasks can be completed reliably.
      - Tool selection and usage become more consistent.

  - id: improve-work-efficiency
    intent: Reduce repeated manual work and improve delivery efficiency with appropriate automation.
    status: active
    priority: medium
    workflows:
      - dev
    successSignals:
      - Repetitive steps are automated where useful.
      - Routine work requires less manual coordination.

reviewSchedule:
  enabled: true
  every: 1w
  purpose: Review goal alignment and advise the governed human only when a meaningful adjustment is justified.

# Logical profile-memory references only. Physical storage, retrieval/indexing,
# and platform access routes are owned by the profile memory configuration.
memory:
  - name: canonical-strategy
    uri: profile-memory://canonical-strategy
    purpose: Current goals, priorities, constraints, and strategic decisions.
    access: read-write
    privacy: profile-private
    precedence: canonical

  - name: human-operating-model
    uri: profile-memory://human-operating-model
    purpose: Human traits, execution evidence, learned patterns, and transparent guidance state.
    access: read-write
    privacy: profile-private
    precedence: canonical

  - name: decision-history
    uri: profile-memory://decision-history
    purpose: Durable decision history and rationale.
    access: read-write
    privacy: profile-private
    precedence: historical

  - name: project-context
    uri: profile-memory://project-context
    purpose: Read-only supporting project and workflow context.
    access: read-only
    privacy: profile-private

commands:
  - calendar
  - messaging
  - email
