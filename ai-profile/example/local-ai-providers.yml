# EXAMPLE ONLY. Operational endpoints and credentials belong in an ignored/private profile.
# AI providers belong to the profile. System agents and AI-enabled commands consume them by provider ID.
schema_version: ai-providers.v1

providers:
  - id: local
    label: Profile local AI
    type: local
    protocol: openai-compatible
    endpoint:
      url: http://127.0.0.1:8080/v1
    authentication:
      type: none
    installation:
      managed_by: install-ai-local-provider
      platform: macos
      preset: system-small
    models:
      - id: system-small
        label: Small fast profile model
        provider_model: system-small
        capabilities: [reasoning, chat, command-assistance]
        context_window_tokens: 32768

  - id: mini-01
    label: Dedicated AI box 1
    type: remote
    protocol: openai-compatible
    endpoint:
      url: http://192.168.1.41:8080/v1
    authentication:
      type: none

  - id: mini-02
    label: Dedicated AI box 2
    type: remote
    protocol: openai-compatible
    endpoint:
      url: http://192.168.1.42:8080/v1
    authentication:
      type: none

bindings:
  system_agent:
    # Each (profile, platform) System instance resolves this profile-level provider binding.
    provider: local
    model: system-small

  commands:
    # AI-enabled commands may use this default when their own policy does not select another provider.
    default_provider: local
