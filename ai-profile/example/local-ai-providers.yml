# EXAMPLE ONLY. Operational endpoints and credentials belong in an ignored/private profile.
# AI providers belong to the profile. System agents and AI-enabled commands consume them by provider ID.
schema_version: local-ai-providers.v1

providers:
  - id: ai-lab-service
    label: Dedicated AI lab service
    protocol: openai-compatible
    endpoint:
      # 192.0.2.0/24 is reserved for documentation and cannot identify a real host.
      url: http://192.0.2.27:8080/v1
    models:
      - id: qwen-hermes
        provider_model: qwen3.5-9b-q4_k_m
        hermes:
          context_window_tokens: 65536
          compression_threshold: 0.25
          compression_target: 0.15
          protect_last_messages: 8
  - id: local-coding-provider
    label: Local coding model provider
    protocol: openai-compatible
    endpoint:
      url: http://192.0.2.32:8000/v1
    models:
      - id: qwen-coder
        provider_model: qwen3-coder-next-q5km
        hermes:
          context_window_tokens: 65536
          compression_threshold: 0.25
          compression_target: 0.15
          protect_last_messages: 8
  - id: gx10-local
    label: Local GX10 writing service
    protocol: openai-compatible
    endpoint:
      url: http://192.0.2.31:8080/v1
    models:
      - id: gemma-writing-q8
        provider_model: TrevorJS/gemma-4-31B-it-uncensored-GGUF:Q8_0
        hermes:
          context_window_tokens: 32768
          compression_threshold: 0.25
          compression_target: 0.15
          protect_last_messages: 8
  - id: openai-service
    label: OpenAI-compatible service
    protocol: openai-compatible
    endpoint:
      url: https://api.example.invalid/v1
    models:
      - id: gpt-sol
        provider_model: gpt-5.6-sol
        hermes:
          context_window_tokens: 65536
          compression_threshold: 0.25
          compression_target: 0.15
          protect_last_messages: 8
