version: 1
command: source-control
capability: git
registered_command: git
command_path: git/git.command.sh
identity_config: commands/source-control/identity.config
credential_scope: remote_host
credential_base_url: https://github.example.invalid
allowed_remote_url_patterns:
  - https://github.example.invalid/example/*
  - git@github.example.invalid:example/*
