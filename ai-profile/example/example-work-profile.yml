version: 3
name: example
description: Copyable example work profile
default_workflow: dev.workflow.md
default_agent: codex
agent_platforms:
  default: gpt-agents
  available:
    - gpt-agents
    - hermes
    - sc
agent_login_method: web_sso
web_auth_policies:
  codex: reuse_scoped_login
  pi: fresh_scoped_login
ai_commands_root: ../../ai-commands
ai_workflows_root: ../../ai-workflows
ai_platforms_root: ../../platforms
agent_identities:
  config: agent-identities.yml

memory:
  config: profile-memory.example.yml
  status: draft

system_agent:
  scope: system
  cardinality: one-per-platform
  providers_config: local-ai-providers.yml
  schedule:
    enabled: true
    every: 10m
    instruction: _common/agents/schedules/system-lifecycle-monitor.yml
  platform_bindings:
    gpt-agents:
      title: "example-system"
      model: gpt-5.6-luna
      reasoning: low
      readiness_token: SYSTEM_READY
    hermes:
      title: "example-system"
      lifecycle_command: hermes-agents
      provider: rtx-3080-ti-model-provider
      model: qwen-hermes
    sc:
      title: "example-system"
      model: platform-default
profile_agents:
  - id: personal-governor
    scope: profile
    config: profile-governor.example.yml
governance_rules_repository: example-governance-rules
governance_rules_surface:
  - AGENTS.md
  - README.md
  - why.md
  - ai-profile
  - ai-workflows
  - ai-commands
commands:
  - id: source-control
    config: commands-config/source-control/config.yml
  - id: medium
    config: commands-config/medium/config.yml
  - id: tts
    config: commands-config/tts/config.yml
  - id: obsidian
    config: commands-config/obsidian/config.yml
  - id: show-context
    config: commands-config/show-context/config
  - id: calendar
    config: commands-config/calendar/config.yml
  - id: messaging
    config: commands-config/messaging/config.yml
  - id: email
    config: commands-config/email/config.yml
  - id: hermes-agents
    config: commands-config/hermes-agents/config.yml
  - id: gpt-agents
    config: commands-config/gpt-agents/config.yml
  - id: install
    config: commands-config/install/config.yml
  - id: infisical
    config: commands-config/infisical/config.example.env
  - id: secrets
    config: commands-config/secrets/config.example.yml
  - id: machine-profile
    config: commands-config/install/config.yml
  - id: lodgify
    config: commands-config/lodgify/config.example.env
  - id: cloudflare
    config: commands-config/cloudflare/config.example.env
  - id: cloudflare-connector
    config: commands-config/cloudflare-connector/config.example.env
workflows:
  - path: dev.workflow.md
    harness: pi
    local_ai:
      providers_config: local-ai-providers.yml
      provider: asus-gx10-model-provider
      model: qwen-coder
    commands:
      - coding
      - ticket-tracker
      - jira
      - test
      - review
      - commit
      - hermes-agents
      - gpt-agents
      - source-control
      - install
      - infisical
      - secrets
      - machine-profile
      - lodgify
      - cloudflare
      - cloudflare-connector
      - logs
      - datadog
      - doc
      - push
      - show-context
      - worktree-bash
      - kdenlive
      - tts
    projects:
      - ref: projects-config/dev/example-service/project.yml
      - ref: projects-config/dev/example-web/project.yml
    agent_context:
      schema_version: codex-project-context.v1
      logs:
        provider: datadog
        capability: datadog
        disabled_providers: []
        supported_operations: [search, tail, errors]
        operations:
          search: { mode: logs }
          tail: { mode: livetail }
          errors: { mode: logs, errors_only: true }
        execution:
          registered_command: datadog
          command_path: datadog/datadog.sh
          command_env_overrides: {}
      tracker:
        provider: jira
        capability: jira
        workspace: example-team
        container: { name: EXAMPLE, id: EXAMPLE, url: https://jira.example.invalid/browse }
        lifecycle: { backlog: Backlog, todo: To Do, in_progress: In Progress, done: Done, canceled: Canceled }
        disabled_providers: []
        policy_references: [workflows-config/dev/commands/jira/ticket-policy.md]
        supported_operations: [search, read, status_inventory, create, checklist_update, lifecycle_update, evidence_gated_closure]
        execution:
          registered_command: jira
          command_path: jira/jira.command.sh
          command_env_overrides:
            JIRA_BASE_URL: https://jira.example.invalid
            JIRA_BROWSE_BASE_URL: https://jira.example.invalid/browse/
            JIRA_ISSUE_KEY_PATTERN: '^[A-Z][A-Z0-9_]*-[0-9]+$'
            JIRA_BROWSER_MODE: existing-chrome
            JIRA_CURRENT_SPRINT_BOARD_URL: 'https://jira.example.invalid/secure/RapidBoard.jspa?rapidView=0&projectKey=EXAMPLE'
            JIRA_DESCRIPTION_TEMPLATE_FILE: workflows-config/dev/commands/jira/description.template.txt
        ticket_policy:
          policy_file: workflows-config/dev/commands/jira/ticket-policy.md
          summary_format: '[project name]: title'
          description_template_file: workflows-config/dev/commands/jira/description.template.txt
  - path: youtube.workflow.md
    harness: hermes
    agent_providers_config: workflows-config/youtube/agent-providers.example.yml
    local_ai:
      providers_config: local-ai-providers.yml
      provider: asus-gx10-model-provider
      model: qwen-coder
    commands: [hermes-agents, writing, tts, lyrics-timestamp, kdenlive, video-handwriting-effect]
    projects:
      - ref: projects-config/youtube/example-channel/project.yml
  - path: writing.workflow.md
    harness: hermes
    local_ai:
      providers_config: local-ai-providers.yml
      provider: asus-gx10-model-provider
      model: qwen-coder
    commands:
      - writing
      - tts
      - medium
      - obsidian
      - source-control
      - show-context
    article_store:
      project_ref: projects-config/writing/example-articles/project.yml
      format: markdown
    review_preferences:
      default_template: blogging/templates/short-experience-educational.md
      method_emphasis:
        on-writing-well: high
        storyworthy: normal
        why-nobody-reads-your-shit: high
      listen_through:
        enabled: true
        command: tts
        voice_profile: narrator
        autoplay: true
        online_synthesis:
          service: speech.platform.bing.com
          default_for_publication_intended_articles: true
    editors:
      - id: obsidian
        command: obsidian
        config: workflows-config/writing/commands/obsidian/config.yml
    destinations:
      - id: medium
        command: medium
        mode: draft-only
        config: workflows-config/writing/commands/medium/config.yml
        release_policy:
          time_zone: Etc/UTC
          max_posts_per_local_day: 1
          target_interval_days: 2
    projects:
      - ref: projects-config/writing/example-writing/project.yml
      - ref: projects-config/writing/example-articles/project.yml
app_mode:
  default: dev
  ui_surface: electron
  use_tmux_view: false
  window_work_area_ratio: 0.7
  side_panel_width_ratio: 0.2
  chat_panel_height_ratio: 0.3
  collapsed_panels: []
  allow_codex_login_bootstrap: true
  allow_codex_logout: true
  workflow_layouts:
    dev.workflow.md: terminal
    youtube.workflow.md: chat
    writing.workflow.md: chat
projects_root_path: ~/projects/example-workspace
sessions_root: ~/.ai-work-sessions/example
org_domain: example.com
envs: [dev, prod]
