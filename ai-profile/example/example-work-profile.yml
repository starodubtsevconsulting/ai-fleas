version: 3
name: example
description: Copyable example work profile
default_workflow: dev.workflow.md
default_agent: codex
agent_platforms:
  default: gpt-agents
  available:
    - gpt-agents
    - hermes
    - sc
agent_login_method: web_sso
web_auth_policies:
  codex: reuse_scoped_login
  pi: fresh_scoped_login
ai_commands_root: ../../ai-commands
ai_workflows_root: ../../ai-workflows
ai_platforms_root: ../../platforms
agent_identities:
  config: agent-identities.yml

# Draft profile-owned permanent-memory configuration. Canonical storage is
# human-readable local Markdown; retrieval/indexing and platform routes are
# implementation choices and are not operational in this example yet.
memory:
  config: profile-memory.example.yml
  status: draft

system_agent:
  scope: system
  cardinality: one-per-platform
  providers_config: local-ai-providers.yml
  schedule:
    enabled: true
    every: 10m
    instruction: _common/agents/schedules/system-lifecycle-monitor.yml
  platform_bindings:
    gpt-agents:
      title: "example-system"
      model: gpt-5.6-luna
      reasoning: low
      readiness_token: SYSTEM_READY
    hermes:
      title: "example-system"
      lifecycle_command: hermes-agents
      provider: ai-lab-service
      model: qwen-coder
    sc:
      title: "example-system"
      model: platform-default
# Profile agents are logical, portable agents owned directly by this profile.
# Platform-specific model/reasoning/runtime tuning belongs in platform role overlays.
profile_agents:
  - id: cross-workflow-governor
    scope: profile
    config: profile-governor.example.yml
governance_rules_repository: example-governance-rules
governance_rules_surface:
  - AGENTS.md
  - README.md
  - why.md
  - ai-profile
  - ai-workflows
  - ai-commands
commands:
  - id: source-control
    config: commands-config/source-control/config.yml
  - id: calendar
    config: commands-config/calendar/config.yml
  - id: messaging
    config: commands-config/messaging/config.yml
  - id: email
    config: commands-config/email/config.yml
  - id: hermes-agents
    config: commands-config/hermes-agents/config.yml
  - id: gpt-agents
    config: commands-config/gpt-agents/config.yml
  - id: install
    config: commands-config/install/config.yml
  - id: machine-profile
    config: commands-config/install/config.yml
  - id: lodgify
    config: commands-config/lodgify/config.example.env
workflows:
  - path: dev.workflow.md
    harness: pi
    local_ai:
      providers_config: local-ai-providers.yml
      provider: local-coding-service
      model: qwen-coder
    commands:
      - coding
      - ticket-tracker
      - jira
      - test
      - review
      - commit
      - hermes-agents
      - gpt-agents
      - source-control
      - install
      - machine-profile
      - lodgify
      - logs
      - datadog
      - doc
      - push
      - show-context
      - worktree-bash
      - kdenlive
      - tts
    projects:
      - ref: projects-config/dev/example-service/project.yml
      - ref: projects-config/dev/example-web/project.yml
    agent_context:
      schema_version: codex-project-context.v1
      logs:
        provider: datadog
        capability: datadog
        disabled_providers: []
        supported_operations:
          - search
          - tail
          - errors
        operations:
          search:
            mode: logs
          tail:
            mode: livetail
          errors:
            mode: logs
            errors_only: true
        execution:
          registered_command: datadog
          command_path: datadog/datadog.sh
          command_env_overrides: {}
      tracker:
        provider: jira
        capability: jira
        workspace: example-team
        container:
          name: EXAMPLE
          id: EXAMPLE
          url: https://jira.example.invalid/browse
        lifecycle:
          backlog: Backlog
          todo: To Do
          in_progress: In Progress
          done: Done
          canceled: Canceled
        disabled_providers: []
        policy_references:
          - workflows-config/dev/commands/jira/ticket-policy.md
        supported_operations:
          - search
          - read
          - status_inventory
          - create
          - checklist_update
          - lifecycle_update
          - evidence_gated_closure
        execution:
          registered_command: jira
          command_path: jira/jira.command.sh
          command_env_overrides:
            JIRA_BASE_URL: https://jira.example.invalid
            JIRA_BROWSE_BASE_URL: https://jira.example.invalid/browse/
            JIRA_ISSUE_KEY_PATTERN: '^[A-Z][A-Z0-9_]*-[0-9]+$'
            JIRA_BROWSER_MODE: existing-chrome
            JIRA_CURRENT_SPRINT_BOARD_URL: 'https://jira.example.invalid/secure/RapidBoard.jspa?rapidView=0&projectKey=EXAMPLE'
            JIRA_DESCRIPTION_TEMPLATE_FILE: workflows-config/dev/commands/jira/description.template.txt
        ticket_policy:
          policy_file: workflows-config/dev/commands/jira/ticket-policy.md
          summary_format: '[project name]: title'
          description_template_file: workflows-config/dev/commands/jira/description.template.txt
  - path: youtube.workflow.md
    harness: hermes
    agent_providers_config: workflows-config/youtube/agent-providers.example.yml
    local_ai:
      providers_config: local-ai-providers.yml
      provider: openai-service
      model: gpt-sol
    commands:
      - writing
      - tts
      - lyrics-timestamp
      - kdenlive
      - video-handwriting-effect
    projects:
      - ref: projects-config/youtube/example-channel/project.yml
app_mode:
  default: dev
  ui_surface: electron
  use_tmux_view: false
  window_work_area_ratio: 0.7
  side_panel_width_ratio: 0.2
  chat_panel_height_ratio: 0.3
  collapsed_panels: []
  allow_codex_login_bootstrap: true
  allow_codex_logout: true
  workflow_layouts:
    dev.workflow.md: terminal
    youtube.workflow.md: chat
projects_root_path: /absolute/path/to/example-workspace
sessions_root: ~/.ai-work-sessions/example
org_domain: example.com
envs: [dev, prod]
