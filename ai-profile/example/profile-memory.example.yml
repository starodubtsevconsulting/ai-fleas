# DRAFT EXAMPLE ONLY: concrete memory runtime/index integration remains evolving.
# The profile owns physical storage and retrieval-provider selection.

schemaVersion: profile-memory.v0-draft
status: draft

canonical:
  type: permanent-memory
  command: permanent-memory
  provider: permanent-memory-synology
  format: markdown
  humanInterface: obsidian-compatible
  sourceOfTruth: true
  method: zettelkasten-v1
  access: read-only
  # Provider-specific connection values live under:
  # commands-config/permanent-memory-synology/permanent-memory-synology.command.config
  # A private profile replaces placeholders with its own host/user/root/key.

retrieval:
  # Derived/indexed memory is optional and rebuildable from canonical memory.
  mode: derived
  provider: mem0
  status: candidate-not-configured
  source: canonical
  sourceOfTruth: false

areas:
  inbox:
    semanticType: fleeting
  references:
    semanticType: reference
  concepts:
    semanticType: permanent
  outputs:
    semanticType: composed-output

platformAccess:
  hermes:
    route: permanent-memory-command
    status: provider-configured-by-profile
  gpt-agents:
    route: permanent-memory-command-or-mcp-adapter
    status: provider-configured-by-profile

rules:
  - canonical-markdown-is-human-readable-source-of-truth
  - retrieval-index-is-derived-and-rebuildable
  - memory-never-crosses-profile-boundary-without-explicit-transfer
  - platform-native-memory-must-not-become-the-only-source-of-truth
  - portable-agents-use-permanent-memory-not-provider-directly
