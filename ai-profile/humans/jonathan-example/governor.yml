schemaVersion: profile-agent-binding.v1
agentId: personal-governor
scope: governed-human
lifecycle: persistent
humanFacing: true
readinessToken: PERSONAL_GOVERNOR_READY
aiBinding: profile-default
subject:
  id: jonathan-example
  name: Jonathan Example

platformBindings:
  gpt-agents:
    utilitySubagents:
      enabled: true
      routing:
        routine: { model: gpt-6-luna, reasoning: low }
        boundedAnalysis: { model: gpt-6-sol, reasoning: medium }
memory:
  - name: governor
    uri: profile-memory://governor
    access: read-write
commands:
  - permanent-memory
